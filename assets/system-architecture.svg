<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 700" role="img" aria-labelledby="t d" font-family="Geist, 'Segoe UI', system-ui, sans-serif">
  <title id="t">Habitty system architecture</title>
  <desc id="d">An installable web app built with Next.js and React talks to Cloud Firestore with owner-only access. Server routes handle AI orchestration, a local embedding model and a daily scheduled job, and call Groq for interactive AI and Gemini for background AI.</desc>
  <defs><marker id="a" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#a59a93"/></marker></defs>
  <rect width="640" height="700" rx="24" fill="#2f2b2f"/>
  <!-- client -->
  <rect x="32" y="32" width="576" height="150" rx="20" fill="#383338" stroke="rgba(236,229,222,.18)"/>
  <text x="56" y="64" fill="#a59a93" font-size="11" letter-spacing="2">CLIENT · INSTALLABLE PWA</text>
  <text x="56" y="96" fill="#ece5de" font-size="20" font-family="Newsreader, Georgia, serif">Next.js · React · TypeScript</text>
  <g font-size="12.5" fill="#c8beb6">
    <rect x="56" y="114" width="150" height="44" rx="12" fill="#2f2b2f"/><text x="131" y="141" text-anchor="middle">Design system</text>
    <rect x="218" y="114" width="150" height="44" rx="12" fill="#2f2b2f"/><text x="293" y="141" text-anchor="middle">Offline-capable data</text>
    <rect x="380" y="114" width="204" height="44" rx="12" fill="#2f2b2f"/><text x="482" y="141" text-anchor="middle">Rules engine · local reminders</text>
  </g>
  <!-- arrows client to db / server -->
  <path d="M170 188v66" stroke="#a59a93" stroke-width="1.5" marker-start="url(#a)" marker-end="url(#a)"/>
  <text x="180" y="226" fill="#a59a93" font-size="11.5">owner-only reads/writes</text>
  <path d="M470 188v66" stroke="#a59a93" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="480" y="226" fill="#a59a93" font-size="11.5">authenticated</text>
  <!-- firestore -->
  <rect x="32" y="262" width="276" height="150" rx="20" fill="#2f3a33" stroke="#4a5d50"/>
  <text x="56" y="294" fill="#a59a93" font-size="11" letter-spacing="2">DATA · SOURCE OF TRUTH</text>
  <text x="56" y="326" fill="#d8e9dd" font-size="20" font-family="Newsreader, Georgia, serif">Cloud Firestore</text>
  <text x="56" y="352" fill="#c8beb6" font-size="12.5">structured personal records</text>
  <text x="56" y="372" fill="#c8beb6" font-size="12.5">validated on read · server-side rules</text>
  <text x="56" y="392" fill="#c8beb6" font-size="12.5">Firebase Authentication</text>
  <!-- server -->
  <rect x="332" y="262" width="276" height="250" rx="20" fill="#30343c" stroke="#474e5c"/>
  <text x="356" y="294" fill="#a59a93" font-size="11" letter-spacing="2">SERVER ROUTES · NODE</text>
  <text x="356" y="326" fill="#dfe4ee" font-size="20" font-family="Newsreader, Georgia, serif">Next.js on Vercel</text>
  <g font-size="12.5" fill="#c8beb6">
    <rect x="356" y="342" width="228" height="34" rx="10" fill="#2f2b2f"/><text x="470" y="364" text-anchor="middle">AI orchestration &amp; validation</text>
    <rect x="356" y="384" width="228" height="34" rx="10" fill="#2f2b2f"/><text x="470" y="406" text-anchor="middle">Local embedding model</text>
    <rect x="356" y="426" width="228" height="34" rx="10" fill="#2f2b2f"/><text x="470" y="448" text-anchor="middle">Shared AI budget</text>
    <rect x="356" y="468" width="228" height="34" rx="10" fill="#2f2b2f"/><text x="470" y="490" text-anchor="middle">Daily scheduled job</text>
  </g>
  <path d="M326 340 H316" stroke="#a59a93" stroke-width="1.5" marker-end="url(#a)"/>
  <!-- providers -->
  <path d="M410 518v58" stroke="#a59a93" stroke-width="1.5" marker-end="url(#a)"/>
  <path d="M540 518v58" stroke="#a59a93" stroke-width="1.5" marker-end="url(#a)"/>
  <rect x="332" y="584" width="128" height="84" rx="18" fill="#3d3234" stroke="#d6b3aa" stroke-opacity=".6"/>
  <text x="396" y="620" text-anchor="middle" fill="#ece5de" font-size="17" font-family="Newsreader, Georgia, serif">Groq</text>
  <text x="396" y="644" text-anchor="middle" fill="#c8beb6" font-size="11.5">interactive</text>
  <rect x="480" y="584" width="128" height="84" rx="18" fill="#363039" stroke="#544a57"/>
  <text x="544" y="620" text-anchor="middle" fill="#ece5de" font-size="17" font-family="Newsreader, Georgia, serif">Gemini</text>
  <text x="544" y="644" text-anchor="middle" fill="#c8beb6" font-size="11.5">background</text>
  <text x="32" y="460" fill="#a59a93" font-size="12.5">AI keys never leave the server.</text>
  <text x="32" y="482" fill="#a59a93" font-size="12.5">Opening a page never calls an AI.</text>
</svg>
